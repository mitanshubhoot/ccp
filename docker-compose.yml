services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ccp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ccp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ccp"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
