# Workflow-level golden cases: several components composed, exact grading.

- id: wf-ingest-dedup-acme-hris
  level: workflow
  difficulty: easy
  source: manual
  tenant: acme
  target: ingest_land
  input: {connector: hris, times: 2}
  expected:
    landed: 47
    duplicates: 47
    raw_rows: 47
    log_records: 47
    dup_files: 47
  notes: Landing the same pull twice writes every row once and every duplicate file into dups/.
  tags: [ingest, dedup]

- id: wf-ingest-late-arrival-orders-by-source-ts
  level: workflow
  difficulty: hard
  source: synthetic
  tenant: acme
  target: ingest_ordering
  input:
    records:
      - {partition: "acme:hris:E1", source_ts: "2026-08-20T17:00:00Z", ref: termination}
      - {partition: "acme:hris:E1", source_ts: "2026-08-25T09:00:00Z", ref: snapshot-after}
      - {partition: "acme:hris:E1", source_ts: "2026-08-19T08:00:00Z", ref: late-role-change}
  expected:
    handled_order: [late-role-change, termination, snapshot-after]
  notes: A late-arriving record with an older source timestamp is processed in its correct position.
  tags: [ingest, ordering]

- id: wf-evaluate-tier1-acme-twice
  level: workflow
  difficulty: hard
  source: manual
  tenant: acme
  target: evaluate_tier1
  input: {}
  expected:
    enqueued: 15
    evaluated: 15
    by_status: {fail: 6, needs_review: 5, partial: 1, pass: 3}
    verdict_rows: 15
    second_run: {enqueued: 15, duplicates: 15, new_rows: 0}
  notes: Every tier 1 (test, subject) pair once; the second full run hits the same evaluation keys and writes nothing. AWS-1, AWS-2, AWS-3 and IDP-1 (A-140, A-141) abstain as needs_review, since the fixture holds no AWS or identity-provider data.
  tags: [evaluators, tier1, idempotency]

- id: wf-evaluate-tier1-globex-twice
  level: workflow
  difficulty: easy
  source: manual
  tenant: globex
  target: evaluate_tier1
  input: {}
  expected:
    enqueued: 13
    evaluated: 13
    by_status: {fail: 3, needs_review: 4, pass: 6}
    verdict_rows: 13
    second_run: {enqueued: 13, duplicates: 13, new_rows: 0}
  notes: AWS-1, AWS-2, AWS-3 and IDP-1 abstain as needs_review with no AWS or identity-provider data.
  tags: [evaluators, tier1, idempotency]
