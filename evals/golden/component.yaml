# -- Phase 7b: chunker, retrieval, tier 2 ----------------------------------------------------

- id: cmp-chunker-globex-access-review-page-split
  level: component
  difficulty: hard
  source: manual
  tenant: globex
  target: chunker_pages
  input:
    evidence_prefix: "manual:evidence:access-review-2026-h1.pdf"
    snippets: ["1. Purpose", "Payroll-GX", "next review is due"]
  expected:
    chunks: {$gte: 2}
    pages: [1, 2]
    snippet_pages: {"1. Purpose": [1], "Payroll-GX": [2], "next review is due": [2]}
  notes: The scope table is split across the page break; every chunk knows its page so a citation can name it.
