- id: cmp-retrieval-acme-with-distractors
  level: component
  difficulty: hard
  source: manual
  tenant: acme
  target: retrieval_metrics
  input: {distractors: 300, include_distractors: true, rerank: true, iterative_scan: true}
  expected:
    $subset:
      embed_model: {$in: [local-hashing-v1, voyage-3-large, text-embedding-3-large]}
      unresolved: []
      queries: 18
      recall_at_5: {$gte: 0.75}
      mrr: {$gte: 0.6}
      ndcg_at_10: {$gte: 0.6}
  notes: Recall@5 and MRR against the fixture corpus plus 300 generated distractors; thresholds hold for the keyless hashing embedder and should only rise with a hosted model.
  tags: [retrieval, metrics]

