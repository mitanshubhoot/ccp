- id: cmp-connector-manual-globex-page-split
  level: component
  difficulty: hard
  source: manual
  tenant: globex
  target: connector_pull
  input:
    connector: manual
    where: {payload.filename: access-review-2026-h1.pdf}
  expected:
    count: 2
    counts_by_type: {manual.document: 2}
    matches:
      - $subset:
          payload:
            $subset:
              evidence_type: access_review_report
              pdf: {$subset: {status: ok, page_count: 2, pages: {$len: 2}}}
  notes: The scope table is split across the page break; page-aware chunking is tested on this.
  tags: [connectors, manual, retrieval]
