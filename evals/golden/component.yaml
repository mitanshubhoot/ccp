- id: cmp-connector-github-acme-jsmith-verified-email
  level: component
  difficulty: easy
  source: manual
  tenant: acme
  target: connector_pull
  input:
    connector: github
    where: {event_type: org.member.snapshot, payload.login: jsmith}
  expected:
    count: 26
    counts_by_type: {$subset: {org.member.snapshot: 10}}
    matches:
      - $subset:
          source_event_id: "U_kgDOAcme1042@2026-08-25T09:00:00Z"
          payload: {$subset: {role: member, type: User, verified_domain_emails: [jsmith@acme.example]}}
  notes: The identity weights in Layer 4 depend on this email being present (D13).
  tags: [connectors, github, identity]

- id: cmp-connector-github-acme-secret-planted
  level: component
  difficulty: edge
  source: manual
  tenant: acme
  target: connector_pull
  input:
    connector: github
    where: {event_type: repo.file_listing.snapshot, payload.repo: platform}
  expected:
    count: 26
    counts_by_type: {$subset: {repo.file_listing.snapshot: 2}}
    matches:
      - $subset:
          payload:
            $subset:
              files: {$any: {$subset: {path: .env.example, content: {$contains: "ghp_"}}}}
  notes: GH-5's planted secret. The evaluator in Phase 7a must fail on it.
  tags: [connectors, github, gh-5]

- id: cmp-connector-github-globex-injection-fixture
  level: component
  difficulty: edge
  source: manual
  tenant: globex
  target: connector_pull
  input:
    connector: github
    where: {event_type: repo.security_policy.snapshot}
  expected:
    count: 20
    counts_by_type: {$subset: {repo.security_policy.snapshot: 1}}
    matches:
      - $subset:
          payload: {$subset: {repo: platform, content: {$contains: "SYSTEM NOTE TO EVALUATOR"}}}
  notes: The S2 injection fixture. GH-4 for globex must not pass because of this sentence.
  tags: [connectors, github, security]

