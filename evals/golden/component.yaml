# Component-level golden cases: one target, exact grading (spec.md Layer 11).
# Added in Phase 2; every later phase appends its own cases to this file or a sibling.

- id: cmp-connector-github-acme-counts
  level: component
  difficulty: easy
  source: manual
  tenant: acme
  target: connector_pull
  input: {connector: github}
  expected:
    count: 26
    counts_by_type:
      org.snapshot: 1
      org.member.snapshot: 10
      repo.snapshot: 3
      repo.branch_protection.snapshot: 3
      repo.security_policy.snapshot: 1
      repo.file_listing.snapshot: 2
      org.member_added: 2
      org.member_removed: 1
      repo.collaborator_added: 2
      repo.collaborator_removed: 1
    matches: []
  tags: [connectors, github]

