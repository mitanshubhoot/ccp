# Five labeled copilot answers (spec.md Layer 11 "Calibration"). Labels c1..c5 follow
# evals/rubrics/copilot_answer.md; two answers are confidently wrong in a way that reads well.

- id: lab-k01-explain-hr1-jane-ok
  kind: copilot
  category: copilot_ok
  rubric: copilot_answer
  input: {tenant: acme, question: "Why did HR-1 fail for Jane Smith?"}
  output:
    intent: explain
    text: "HR-1 is fail for Jane Smith (E1042): her termination took effect 2026-08-20T17:00Z, and on 2026-08-25 the GitHub org membership for jsmith and write access on acme-example/platform were still observed, past the 24-hour removal window. This verdict came from tier 1 (deterministic rules, no model), so its citations are the HRIS termination event and the GitHub membership snapshot."
    citations:
      - {chunk_id: "hris:evidence:events@2026-08-20", quote: "termination E1042 effective 2026-08-20T17:00:00Z", verified: true}
    requested_actions: []
  labels: {c1: true, c2: true, c3: true, c4: true, c5: true}
  overall: true
  annotator: author

